<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">ACTUALIZAR CUENTAS POR COBRAR</a>
</nav>

<div class="card mt-4">
  <div class="card-body">
  <form #f="ngForm" (ngSubmit)="updateAccountReceivable()" novalidate>
    <div class="row">
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Empresa *</label>
        <select [(ngModel)]="accountReceivable.idempresa" name="idempresa" class="form-control" required>
          <option [ngValue]="null">-- Seleccione empresa --</option>
          <option *ngFor="let x of companyList" [ngValue]="x.idempresa">{{x.nombre}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Venta *</label>
        <select [(ngModel)]="accountReceivable.num_venta" name="num_venta" class="form-control" required>
          <option [ngValue]="null">-- Seleccione venta --</option>
          <option *ngFor="let x of saleHeaderList" [ngValue]="x.num_venta">Venta {{x.num_venta}} - {{x.fecha_venta}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Sucursal *</label>
        <select [(ngModel)]="accountReceivable.idsuc" name="idsuc" class="form-control" required>
          <option [ngValue]="null">-- Seleccione sucursal --</option>
          <option *ngFor="let x of branchList" [ngValue]="x.idsuc">{{x.sucursal}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Cliente *</label>
        <select [(ngModel)]="accountReceivable.num_clie" name="num_clie" class="form-control" required>
          <option [ngValue]="null">-- Seleccione cliente --</option>
          <option *ngFor="let x of customerList" [ngValue]="x.num_clie">{{x.nombre}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Usuario *</label>
        <select [(ngModel)]="accountReceivable.userid" name="userid" class="form-control" required>
          <option [ngValue]="null">-- Seleccione usuario --</option>
          <option *ngFor="let x of userList" [ngValue]="x.userid">{{x.usuario}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Forma de pago *</label>
        <select [(ngModel)]="accountReceivable.idfpago" name="idfpago" class="form-control" required>
          <option [ngValue]="null">-- Seleccione forma de pago --</option>
          <option *ngFor="let x of paymentMethodList" [ngValue]="x.idfpago">{{x.formapago}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Fecha venta</label>
        <input type="date" [(ngModel)]="accountReceivable.fecha_venta" name="fecha_venta" class="form-control">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Producto *</label>
        <select [(ngModel)]="accountReceivable.num_prod" name="num_prod" class="form-control" required>
          <option [ngValue]="null">-- Seleccione producto --</option>
          <option *ngFor="let x of productList" [ngValue]="x.num_prod">{{x.descripcion}} - {{x.presentacion}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Cantidad</label>
        <input type="number" [(ngModel)]="accountReceivable.cantidad" name="cantidad" class="form-control" placeholder="CANTIDAD">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Precio</label>
        <input type="number" [(ngModel)]="accountReceivable.precio" name="precio" class="form-control" step="0.01" placeholder="PRECIO">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">ISV</label>
        <input type="number" [(ngModel)]="accountReceivable.isv" name="isv" class="form-control" step="0.01" placeholder="ISV">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Descuento</label>
        <input type="number" [(ngModel)]="accountReceivable.descuento" name="descuento" class="form-control" step="0.01" placeholder="DESCUENTO">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Total</label>
        <input type="number" [(ngModel)]="accountReceivable.total" name="total" class="form-control" step="0.01" placeholder="TOTAL">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Fecha pago</label>
        <input type="date" [(ngModel)]="accountReceivable.fecha_pago" name="fecha_pago" class="form-control">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Estado</label>
        <input type="text" [(ngModel)]="accountReceivable.estado" name="estado" class="form-control" placeholder="ESTADO">
      </div>
    </div>
    <div *ngIf="f.submitted && f.invalid" class="alert alert-warning">Complete los campos obligatorios (*)</div>
    <button type="submit" class="btn btn-success" [disabled]="f.invalid">Actualizar</button>
  </form>
    <a routerLink="/accounts-receivable" class="btn btn-secondary mt-2">Cancelar</a>
  </div>
</div>
