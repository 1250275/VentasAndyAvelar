<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE USUARIOS</a>
</nav>

<div class="container">
  <div class="row mt-4">
    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>SUCURSAL</th>
          <th>TIPO USUARIO</th>
          <th>EMPLEADO</th>
          <th>USUARIO</th>
          <th>ESTADO</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{user.userid}}</td>
          <td>{{user.idempresa}}</td>
          <td>{{user.idsuc}}</td>
          <td>{{user.idtpusuario}}</td>
          <td>{{user.idemp}}</td>
          <td>{{user.usuario}}</td>
          <td>{{user.estado}}</td>
          <td><button class="btn btn-danger">Eliminar</button></td>
          <td><button class="btn btn-success">Actualizar</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
