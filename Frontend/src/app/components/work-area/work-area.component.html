<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE AREAS DE TRABAJO</a>
</nav>

<div class="container">
  <div class="row mt-4">
    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>SUCURSAL</th>
          <th>AREA</th>
          <th>FECHA CREACION</th>
          <th>ESTADO</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let workArea of workAreas">
          <td>{{workArea.idarea}}</td>
          <td>{{workArea.idempresa}}</td>
          <td>{{workArea.idsuc}}</td>
          <td>{{workArea.area}}</td>
          <td>{{workArea.fecha_creacion}}</td>
          <td>{{workArea.estado}}</td>
          <td><button class="btn btn-danger">Eliminar</button></td>
          <td><button class="btn btn-success">Actualizar</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
