<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE TIPOS DE PRODUCTO</a>
</nav>

<div class="card mt-4">
  <div class="card-body">
  <form #f="ngForm" (ngSubmit)="addProductType()" novalidate>
    <div class="row">
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Empresa *</label>
        <select [(ngModel)]="productType.idempresa" name="idempresa" class="form-control" required>
          <option [ngValue]="null">-- Seleccione empresa --</option>
          <option *ngFor="let x of companyList" [ngValue]="x.idempresa">{{x.nombre}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Tipo</label>
        <input type="text" [(ngModel)]="productType.tipo" name="tipo" class="form-control" placeholder="TIPO">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Estado</label>
        <input type="text" [(ngModel)]="productType.estado" name="estado" class="form-control" placeholder="ESTADO">
      </div>
    </div>
    <div *ngIf="f.submitted && f.invalid" class="alert alert-warning">Complete los campos obligatorios (*)</div>
    <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Agregar</button>
  </form>
  </div>
</div>

<div class="card mt-4 shadow-sm">
  <div class="card-body py-3">
    <div class="row g-2 align-items-center">
      <div class="col-lg-6">
        <div class="input-group search-box">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242.656a5 5 0 1 1 0-10 5 5 0 0 1 0 10"/>
            </svg>
          </span>
          <input type="search" class="form-control" name="filterPost" placeholder="Buscar tipo de producto..." [(ngModel)]="filterPost" autocomplete="off">
          <button *ngIf="filterPost" type="button" class="btn btn-outline-secondary" (click)="filterPost = ''">Limpiar</button>
        </div>
        <div class="form-text">Escriba al menos 3 caracteres para filtrar.</div>
      </div>
    </div>
  </div>
</div>

<div class="table-responsive mt-3">
  <table class="table table-bordered table-hover">
    <thead>
      <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>TIPO</th>
          <th>ESTADO</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="(productTypes | productTypeFilter:filterPost) as rows">
      <tr *ngFor="let item of rows">
          <td>{{item.idtpprod}}</td>
          <td>{{item.idempresa}}</td>
          <td>{{item.tipo}}</td>
          <td>{{item.estado}}</td>
        <td><button class="btn btn-danger" (click)="deleteProductType(item.idtpprod)">Eliminar</button></td>
        <td><button class="btn btn-success" [routerLink]="['/product-types/edit', item.idtpprod]">Actualizar</button></td>
      </tr>
      <tr *ngIf="rows.length === 0">
        <td colspan="6" class="text-center text-muted py-4">No se encontraron registros<span *ngIf="filterPost"> para "{{ filterPost }}"</span>.</td>
      </tr>
      </ng-container>
    </tbody>
  </table>
</div>
