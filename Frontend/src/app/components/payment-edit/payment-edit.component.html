<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">ACTUALIZAR PAGOS</a>
</nav>

<div class="card mt-4">
  <div class="card-body">
  <form #f="ngForm" (ngSubmit)="updatePayment()" novalidate>
    <div class="row">
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Empresa (id) *</label>
        <input type="number" [(ngModel)]="payment.idempresa" name="idempresa" class="form-control" placeholder="EMPRESA (ID)" required>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Venta (no.) *</label>
        <input type="number" [(ngModel)]="payment.num_venta" name="num_venta" class="form-control" placeholder="VENTA (NO.)" required>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Sucursal (id) *</label>
        <input type="number" [(ngModel)]="payment.idsuc" name="idsuc" class="form-control" placeholder="SUCURSAL (ID)" required>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Cliente (id) *</label>
        <input type="number" [(ngModel)]="payment.num_clie" name="num_clie" class="form-control" placeholder="CLIENTE (ID)" required>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Usuario (id) *</label>
        <input type="number" [(ngModel)]="payment.userid" name="userid" class="form-control" placeholder="USUARIO (ID)" required>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Forma de pago (id) *</label>
        <input type="number" [(ngModel)]="payment.idfpago" name="idfpago" class="form-control" placeholder="FORMA DE PAGO (ID)" required>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Fecha pago</label>
        <input type="date" [(ngModel)]="payment.fecha_pago" name="fecha_pago" class="form-control">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Producto (id) *</label>
        <input type="number" [(ngModel)]="payment.num_prod" name="num_prod" class="form-control" placeholder="PRODUCTO (ID)" required>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Cantidad</label>
        <input type="number" [(ngModel)]="payment.cantidad" name="cantidad" class="form-control" placeholder="CANTIDAD">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Precio</label>
        <input type="number" [(ngModel)]="payment.precio" name="precio" class="form-control" step="0.01" placeholder="PRECIO">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">ISV</label>
        <input type="number" [(ngModel)]="payment.isv" name="isv" class="form-control" step="0.01" placeholder="ISV">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Descuento</label>
        <input type="number" [(ngModel)]="payment.descuento" name="descuento" class="form-control" step="0.01" placeholder="DESCUENTO">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Total</label>
        <input type="number" [(ngModel)]="payment.total" name="total" class="form-control" step="0.01" placeholder="TOTAL">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Estado</label>
        <input type="text" [(ngModel)]="payment.estado" name="estado" class="form-control" placeholder="ESTADO">
      </div>
    </div>
    <div *ngIf="f.submitted && f.invalid" class="alert alert-warning">Complete los campos obligatorios (*)</div>
    <button type="submit" class="btn btn-success" [disabled]="f.invalid">Actualizar</button>
  </form>
    <a routerLink="/payments" class="btn btn-secondary mt-2">Cancelar</a>
  </div>
</div>
