<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE FORMAS DE PAGO</a>
</nav>

<div class="card mt-4">
  <div class="card-body">
  <form #f="ngForm" (ngSubmit)="addPaymentMethod()" novalidate>
    <div class="row">
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Empresa *</label>
        <select [(ngModel)]="paymentMethod.idempresa" name="idempresa" class="form-control" required>
          <option [ngValue]="null">-- Seleccione empresa --</option>
          <option *ngFor="let x of companyList" [ngValue]="x.idempresa">{{x.nombre}}</option>
        </select>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Forma de pago</label>
        <input type="text" [(ngModel)]="paymentMethod.formapago" name="formapago" class="form-control" placeholder="FORMA DE PAGO">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Estado</label>
        <input type="text" [(ngModel)]="paymentMethod.estado" name="estado" class="form-control" placeholder="ESTADO">
      </div>
    </div>
    <div *ngIf="f.submitted && f.invalid" class="alert alert-warning">Complete los campos obligatorios (*)</div>
    <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Agregar</button>
  </form>
  </div>
</div>

<div class="card mt-4 shadow-sm">
  <div class="card-body py-3">
    <div class="row g-2 align-items-center">
      <div class="col-lg-6">
        <div class="input-group search-box">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242.656a5 5 0 1 1 0-10 5 5 0 0 1 0 10"/>
            </svg>
          </span>
          <input type="search" class="form-control" name="filterPost" placeholder="Buscar forma de pago..." [(ngModel)]="filterPost" autocomplete="off">
          <button *ngIf="filterPost" type="button" class="btn btn-outline-secondary" (click)="filterPost = ''">Limpiar</button>
        </div>
        <div class="form-text">Escriba al menos 3 caracteres para filtrar.</div>
      </div>
      <div class="col-lg-6 d-flex justify-content-lg-end align-items-center gap-2">
        <span class="text-muted small">Exportar:</span>
        <button type="button" class="btn btn-success btn-export" (click)="exportToExcel()" title="Exportar la tabla a Excel">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M5.884 6.68a.5.5 0 1 0-.768.64L7.349 10l-2.233 2.68a.5.5 0 0 0 .768.64L8 10.781l2.116 2.54a.5.5 0 0 0 .768-.641L8.651 10l2.233-2.68a.5.5 0 0 0-.768-.64L8 9.219l-2.116-2.54z"/>
              <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/>
            </svg>
          Excel
        </button>
        <button type="button" class="btn btn-danger btn-export" (click)="openPDF()" title="Descargar la tabla en PDF">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/>
              <path d="M4.603 14.087a.8.8 0 0 1-.438-.42c-.195-.388-.13-.776.08-1.102.198-.307.526-.568.897-.787a7.7 7.7 0 0 1 1.482-.645 20 20 0 0 0 1.062-2.227 7.3 7.3 0 0 1-.43-1.295c-.086-.4-.119-.796-.046-1.136.075-.354.274-.672.65-.823.192-.077.4-.12.602-.077a.7.7 0 0 1 .477.365c.088.164.12.356.127.538.007.188-.012.396-.047.614-.084.51-.27 1.134-.52 1.794a11 11 0 0 0 .98 1.686 5.8 5.8 0 0 1 1.334.05c.364.066.734.195.96.465.12.144.193.32.2.518.007.192-.047.382-.138.563a1.04 1.04 0 0 1-.354.416.86.86 0 0 1-.51.138c-.331-.014-.654-.196-.933-.417a5.7 5.7 0 0 1-.911-.95 11.7 11.7 0 0 0-1.997.406 11.3 11.3 0 0 1-1.02 1.51c-.292.35-.609.656-.927.787a.8.8 0 0 1-.58.029m1.379-1.901q-.25.115-.459.238c-.328.194-.541.383-.647.547-.094.145-.096.25-.04.361q.016.032.026.044l.035-.012c.137-.056.355-.235.635-.572a8 8 0 0 0 .45-.606m1.64-1.33a13 13 0 0 1 1.01-.193 12 12 0 0 1-.51-.858 21 21 0 0 1-.5 1.05zm2.446.45q.226.245.435.41c.24.19.407.253.498.256a.1.1 0 0 0 .07-.015.3.3 0 0 0 .094-.125.44.44 0 0 0 .059-.2.1.1 0 0 0-.026-.063c-.052-.062-.2-.152-.518-.209a4 4 0 0 0-.612-.053zM8.078 7.8a7 7 0 0 0 .2-.828q.046-.282.038-.465a.6.6 0 0 0-.032-.198.5.5 0 0 0-.145.04c-.087.035-.158.106-.196.283-.04.192-.03.469.046.822q.036.167.09.346z"/>
            </svg>
          PDF
        </button>
      </div>
    </div>
  </div>
</div>

<div class="table-responsive mt-3">
  <table class="table table-bordered table-hover" id="tabla">
    <thead>
      <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>FORMA DE PAGO</th>
          <th>ESTADO</th>
        <th class="no-export"></th>
        <th class="no-export"></th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="(paymentMethods | paymentMethodFilter:filterPost) as rows">
      <tr *ngFor="let item of rows">
          <td>{{item.idfpago}}</td>
          <td>{{item.idempresa}}</td>
          <td>{{item.formapago}}</td>
          <td>{{item.estado}}</td>
        <td class="no-export"><button class="btn btn-danger" (click)="deletePaymentMethod(item.idfpago)">Eliminar</button></td>
        <td class="no-export"><button class="btn btn-success" [routerLink]="['/payment-methods/edit', item.idfpago]">Actualizar</button></td>
      </tr>
      <tr *ngIf="rows.length === 0">
        <td colspan="6" class="text-center text-muted py-4">No se encontraron registros<span *ngIf="filterPost"> para "{{ filterPost }}"</span>.</td>
      </tr>
      </ng-container>
    </tbody>
  </table>
</div>
