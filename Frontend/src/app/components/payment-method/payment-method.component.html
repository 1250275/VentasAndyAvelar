<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE FORMAS DE PAGO</a>
</nav>

<div class="card mt-4">
  <div class="card-body">
  <form #f="ngForm" (ngSubmit)="addPaymentMethod()" novalidate>
    <div class="row">
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Empresa (id) *</label>
        <input type="number" [(ngModel)]="paymentMethod.idempresa" name="idempresa" class="form-control" placeholder="EMPRESA (ID)" required>
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Forma de pago</label>
        <input type="text" [(ngModel)]="paymentMethod.formapago" name="formapago" class="form-control" placeholder="FORMA DE PAGO">
      </div>
      <div class="form-group col-md-4 mb-3">
        <label class="control-label">Estado</label>
        <input type="text" [(ngModel)]="paymentMethod.estado" name="estado" class="form-control" placeholder="ESTADO">
      </div>
    </div>
    <div *ngIf="f.submitted && f.invalid" class="alert alert-warning">Complete los campos obligatorios (*)</div>
    <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Agregar</button>
  </form>
  </div>
</div>

<div class="table-responsive mt-4">
  <table class="table table-bordered table-hover">
    <thead>
      <tr>
          <th>NO</th>
          <th>EMPRESA (ID)</th>
          <th>FORMA DE PAGO</th>
          <th>ESTADO</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of paymentMethods">
          <td>{{item.idfpago}}</td>
          <td>{{item.idempresa}}</td>
          <td>{{item.formapago}}</td>
          <td>{{item.estado}}</td>
        <td><button class="btn btn-danger" (click)="deletePaymentMethod(item.idfpago)">Eliminar</button></td>
        <td><button class="btn btn-success" [routerLink]="['/payment-methods/edit', item.idfpago]">Actualizar</button></td>
      </tr>
    </tbody>
  </table>
</div>
