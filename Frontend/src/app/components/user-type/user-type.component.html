<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE TIPOS DE USUARIO</a>
</nav>

<div class="container">
  <div class="row mt-4">
    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>NO</th>
          <th>EMPRESA</th>
          <th>TIPO</th>
          <th>ESTADO</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let userType of userTypes">
          <td>{{userType.idtpusuario}}</td>
          <td>{{userType.idempresa}}</td>
          <td>{{userType.tipo}}</td>
          <td>{{userType.estado}}</td>
          <td><button class="btn btn-danger">Eliminar</button></td>
          <td><button class="btn btn-success">Actualizar</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
